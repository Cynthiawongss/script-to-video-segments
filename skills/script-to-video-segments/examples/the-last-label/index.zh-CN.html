const plan=JSON.parse(document.querySelector('#fixture').textContent);const labels={location:'地点',mira:'Mira',noah:'Noah',screen:'屏幕',label:'标签',light:'光线'};function stateInto(id,state){const el=document.getElementById(id);el.replaceChildren();Object.entries(state).forEach(([k,v])=>{const p=document.createElement('p');p.textContent=(labels[k]||k)+'：'+v;el.append(p)})}function select(index){const seg=plan.segments[index];document.querySelectorAll('[data-segment]').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));stateInto('opening',seg.opening_state);stateInto('closing',seg.closing_state);const list=document.getElementById('beats');list.replaceChildren();seg.beats.forEach(b=>{const row=document.createElement('article');row.className='beat';const time=document.createElement('time');time.textContent=b.start+'–'+b.end+' s';const body=document.createElement('div');const h=document.createElement('h3');h.textContent=b.camera;const p=document.createElement('p');p.textContent=b.action;body.append(h,p);b.dialogue.forEach(d=>{const q=document.createElement('blockquote');q.textContent=d.speaker+' ['+d.id+']：'+d.text;body.append(q)});const audio=document.createElement('p');audio.className='audio';audio.textContent='声音：'+b.audio;body.append(audio);row.append(time,body);list.append(row)});document.getElementById('boundary').textContent=index<2?'状态交接：'+seg.id+' 的结束状态与 '+plan.segments[index+1].id+' 的开场状态一致。':'结尾停在纠正后的标签旁；没有增加新的对白或剧情。';document.getElementById('prompt').textContent=seg.lock_ids.map(id=>id+': '+plan.locks[id]).join('\n')+'\n\nOpening: '+JSON.stringify(seg.opening_state)+'\n\n'+seg.beats.map(b=>b.start+'–'+b.end+' seconds: '+b.camera+' '+b.action+'\n'+b.dialogue.map(d=>d.speaker+': '+d.text).join('\n')+'\nSound: '+b.audio).join('\n\n')+'\n\nClosing: '+JSON.stringify(seg.closing_state);}
